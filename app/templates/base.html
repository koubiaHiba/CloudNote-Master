<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudNote - {% block title %}Mes Notes{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-brand">
                <div class="site-title">☁️ CloudNote</div>
                <div class="site-subtitle">Personal Notes App</div>
            </div>
            <nav class="site-nav">
                <a href="/" class="nav-link">🏠 Accueil</a>
                <a href="/about" class="nav-link">ℹ️ About</a>
                {% if current_user.is_authenticated %}
                    <a href="/dashboard" class="nav-link">📝 Dashboard</a>
                    <a href="/logout" class="nav-link" style="color: #ff9999;">🚪 Déconnexion</a>
                {% else %}
                    <a href="/login" class="nav-link">🔑 Connexion</a>
                    <a href="/register" class="nav-link">📝 Inscription</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 CloudNote - Application de notes personnelles</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
