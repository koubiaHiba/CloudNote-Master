<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note partagée - CloudNote</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .shared-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .date {
            color: #999;
            font-size: 12px;
            margin-bottom: 30px;
        }
        .content {
            line-height: 1.8;
            color: #333;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="shared-card">
        <h1>{{ note.title }}</h1>
        <div class="date">Partagé le {{ note.created_at.strftime('%d/%m/%Y') }}</div>
        <div class="content">{{ content|safe }}</div>
        <div class="footer">📝 CloudNote - Application de notes personnelles</div>
    </div>
</body>
</html>
