{% extends "base.html" %}
{% block content %}
<style>
    /* Styles spécifiques pour la page de login */
    .auth-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 40px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .auth-container h2 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
        font-weight: 600;
        position: relative;
    }

    .auth-container h2::after {
        content: '';
        display: block;
        width: 50px;
        height: 3px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 10px auto 0;
        border-radius: 3px;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .auth-input {
        padding: 14px 18px;
        border: 2px solid #e1e5e9;
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
    }

    .auth-input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .auth-input::placeholder {
        color: #adb5bd;
        font-weight: 400;
    }

    .auth-btn {
        padding: 14px 18px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .auth-btn:active {
        transform: translateY(0);
    }

    .auth-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .auth-link {
        text-align: center;
        margin-top: 25px;
        color: #6c757d;
        font-size: 14px;
    }

    .auth-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
    }

    .auth-link a:hover {
        color: #764ba2;
        text-decoration: underline;
    }

    .alert {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
        animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .alert-error {
        background: #fee;
        color: #c33;
        border: 1px solid #fcc;
    }

    .alert-success {
        background: #efe;
        color: #3c3;
        border: 1px solid #cfc;
    }

    .loading {
        position: relative;
        color: transparent;
    }

    .loading::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin-left: -10px;
        margin-top: -10px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (max-width: 768px) {
        .auth-container {
            margin: 20px;
            padding: 30px 20px;
        }
        
        .auth-container h2 {
            font-size: 24px;
        }
        
        .auth-input,
        .auth-btn {
            padding: 12px 16px;
            font-size: 14px;
        }
    }
</style>

<div class="auth-container">
    <h2>Connexion</h2>
    <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
    <div id="successMessage" class="alert alert-success" style="display: none;"></div>
    
    <form class="auth-form" onsubmit="event.preventDefault(); login();">
        <input type="text" id="username" class="auth-input" placeholder="Nom d'utilisateur" required autocomplete="username">
        <input type="password" id="password" class="auth-input" placeholder="Mot de passe" required autocomplete="current-password">
        <button type="submit" id="loginBtn" class="auth-btn">Se connecter</button>
    </form>
    
    <div class="auth-link">
        Pas encore de compte ? <a href="/register">Créer un compte</a>
    </div>
</div>

<script>
async function login() {
    const btn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('errorMessage');
    const successDiv = document.getElementById('successMessage');
    
    // Réinitialiser les messages
    btn.disabled = true;
    btn.classList.add('loading');
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    // Validation simple
    if (!username || !password) {
        errorDiv.textContent = 'Veuillez remplir tous les champs.';
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.classList.remove('loading');
        return;
    }
    
    try {
        const res = await fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            successDiv.textContent = 'Connexion réussie ! Redirection...';
            successDiv.style.display = 'block';
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        } else {
            errorDiv.textContent = data.error || 'Identifiants incorrects. Veuillez réessayer.';
            errorDiv.style.display = 'block';
            btn.disabled = false;
            btn.classList.remove('loading');
        }
    } catch (error) {
        errorDiv.textContent = 'Erreur de connexion. Vérifiez votre réseau.';
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.classList.remove('loading');
    }
}

// Permettre la soumission avec la touche Entrée
document.querySelector('.auth-form').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        login();
    }
});
</script>
{% endblock %}
